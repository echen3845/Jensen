services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: jensen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
      POSTGRES_DB: jensen
    volumes:
      - jensen-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jensen"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  jensen-db:
